<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Throughline Ops</title>
<script>
  // Set the theme attribute before first paint, same reasoning as the
  // main app's useTheme.js -- otherwise the page flashes the wrong
  // theme for a frame on load. Own localStorage key (not the main app's
  // "theme") since this is a separate audience/credential -- picking a
  // theme here shouldn't silently change the consumer app's theme too.
  (function () {
    var saved = localStorage.getItem('admin_theme');
    var theme = saved === 'light' || saved === 'dark' ? saved
      : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    document.documentElement.dataset.theme = theme;
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
  /* Same design tokens as frontend/src/theme.css -- kept in sync by value,
     not by sharing the file, since this is a plain server-rendered page
     with no build step. Dark is the bare :root default, same as the main
     app; [data-theme="light"] overrides every color token. */
  :root {
    --wa-bg-app: #313338;
    --wa-panel: #2b2d31;
    --wa-hover: #35373c;
    --wa-border: #1f2023;
    --wa-text: #f2f3f5;
    --wa-text-soft: #a0a2a7;
    --wa-accent: #1FC8B4;
    --wa-accent-dark: #16A192;
    --wa-accent-solid: #128176;
    --wa-accent-solid-hover: #107066;
    --wa-danger: #da373c;
    --shadow-lg: 0 8px 24px rgba(0,0,0,0.38);
    --radius-sm: 6px;
    --radius-lg: 10px;
    --radius-round: 50%;
    --focus-ring: rgba(31,200,180,0.2);
  }
  :root[data-theme="light"] {
    --wa-bg-app: #ffffff;
    --wa-panel: #f2f3f5;
    --wa-hover: #e3e5e8;
    --wa-border: #e3e4e8;
    --wa-text: #060607;
    --wa-text-soft: #5c5e66;
    --wa-accent: #0F9C8C;
    --wa-accent-dark: #0C7E72;
    --wa-accent-solid: #0e816f;
    --wa-accent-solid-hover: #0c6e5f;
    --wa-danger: #da373c;
    --shadow-lg: 0 8px 24px rgba(20,20,30,0.14);
    --focus-ring: rgba(15,156,140,0.18);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--wa-bg-app); color: var(--wa-text);
    font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    transition: background-color 240ms cubic-bezier(0.4,0,0.2,1), color 240ms cubic-bezier(0.4,0,0.2,1);
  }
  .theme-toggle {
    position: fixed; top: 16px; right: 16px; width: 36px; height: 36px; border-radius: var(--radius-round);
    border: 1px solid var(--wa-border); background: var(--wa-panel); color: var(--wa-text-soft);
    display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer;
    transition: background-color 180ms cubic-bezier(0.4,0,0.2,1);
  }
  .theme-toggle:hover { background: var(--wa-hover); }
  .auth-card {
    background: var(--wa-panel); border-radius: var(--radius-lg); padding: 32px; width: 340px; max-width: calc(100vw - 32px);
    box-shadow: var(--shadow-lg);
    transition: background-color 240ms cubic-bezier(0.4,0,0.2,1);
  }
  .auth-card h1 { font-size: 24px; margin: 0 0 4px; color: var(--wa-accent-dark); font-weight: 800; }
  .auth-card p.hint { font-size: 13px; color: var(--wa-text-soft); margin: 0 0 24px; }
  label { display: block; font-size: 13px; color: var(--wa-text-soft); margin-bottom: 6px; margin-top: 16px; font-weight: 500; }
  .field {
    width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid var(--wa-border); border-radius: var(--radius-sm);
    background: var(--wa-bg-app); color: var(--wa-text); font-size: 14px; font-family: inherit;
    transition: border-color 180ms cubic-bezier(0.4,0,0.2,1), box-shadow 180ms cubic-bezier(0.4,0,0.2,1), background-color 240ms cubic-bezier(0.4,0,0.2,1);
  }
  .field:focus { outline: none; border-color: var(--wa-accent); box-shadow: 0 0 0 3px var(--focus-ring); }
  .btn {
    width: 100%; margin-top: 24px; padding: 10px; border: 0; border-radius: var(--radius-sm);
    background: var(--wa-accent-solid); color: #fff; font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer;
    transition: background-color 180ms cubic-bezier(0.4,0,0.2,1);
  }
  .btn:hover { background: var(--wa-accent-solid-hover); }
  .auth-error { color: var(--wa-danger); font-size: 13px; margin-top: 14px; }
</style>
</head>
<body>
  <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" aria-label="Toggle light/dark theme">🌙</button>
  <div class="auth-card">
    <h1>Throughline Ops</h1>
    <p class="hint">Sign in to view job status, database and compute metrics.</p>
    <form method="POST" action="/admin/login">
      <label for="username">Username</label>
      <input class="field" type="text" id="username" name="username" autocomplete="username" autofocus>
      <label for="password">Password</label>
      <input class="field" type="password" id="password" name="password" autocomplete="current-password">
      <button class="btn" type="submit">Sign in</button>
    </form>
    {% if error %}<div class="auth-error">{{ error }}</div>{% endif %}
  </div>
<script>
  function updateToggleIcon() {
    document.getElementById('theme-toggle').textContent = document.documentElement.dataset.theme === 'light' ? '☀️' : '🌙';
  }
  function toggleTheme() {
    var next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
    document.documentElement.dataset.theme = next;
    localStorage.setItem('admin_theme', next);
    updateToggleIcon();
  }
  updateToggleIcon();
</script>
</body>
</html>
