<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{% endblock %} · Throughline</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #16181d; --soft: #4e535c; --faint: #6f747c;
    --border: #e2e5ea; --accent: #0e7c70; --danger: #b4232a; --todo-bg: #fff4d6; --todo: #7a5600;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1d21; --panel: #26282d; --text: #eef0f3; --soft: #b9bcc2; --faint: #8f939a;
      --border: #383b42; --accent: #3fd0bd; --danger: #f2787c; --todo-bg: #3d3420; --todo: #f3cf74;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  header { border-bottom: 1px solid var(--border); background: var(--panel); }
  .bar { max-width: 760px; margin: 0 auto; padding: 14px 20px; display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  .brand { font-weight: 800; color: var(--accent); text-decoration: none; font-size: 18px; margin-right: auto; }
  .bar a.nav { color: var(--soft); text-decoration: none; font-size: 14px; font-weight: 600; }
  .bar a.nav[aria-current="page"] { color: var(--text); text-decoration: underline; text-underline-offset: 4px; }
  main { max-width: 760px; margin: 0 auto; padding: 28px 20px 64px; }
  h1 { font-size: 30px; line-height: 1.2; margin: 0 0 6px; }
  .meta { color: var(--faint); font-size: 14px; margin-bottom: 24px; }
  h2 { font-size: 20px; margin: 34px 0 8px; }
  h3 { font-size: 16px; margin: 20px 0 6px; }
  p, li { color: var(--soft); }
  strong { color: var(--text); }
  ul { padding-left: 22px; }
  li { margin: 4px 0; }
  a { color: var(--accent); }
  .summary { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px 20px; margin: 18px 0 8px; }
  .summary li { margin: 6px 0; }
  table { width: 100%; border-collapse: collapse; font-size: 14.5px; margin: 10px 0; }
  th, td { text-align: left; vertical-align: top; padding: 9px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--text); font-size: 13px; }
  td { color: var(--soft); }
  .table-wrap { overflow-x: auto; }
  .todo { background: var(--todo-bg); color: var(--todo); padding: 1px 6px; border-radius: 4px; font-weight: 600; font-size: .92em; }
  footer { border-top: 1px solid var(--border); color: var(--faint); font-size: 13px; }
  footer .bar a { color: var(--faint); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  {% block style %}{% endblock %}
</style>
</head>
<body>
<header>
  <div class="bar">
    <a class="brand" href="/">Throughline</a>
    <a class="nav" href="/privacy" {% if active == 'privacy' %}aria-current="page"{% endif %}>Privacy</a>
    <a class="nav" href="/terms" {% if active == 'terms' %}aria-current="page"{% endif %}>Terms</a>
    <a class="nav" href="/account/delete" {% if active == 'delete' %}aria-current="page"{% endif %}>Delete account</a>
  </div>
</header>
<main>
{% block content %}{% endblock %}
</main>
<footer>
  <div class="bar">
    <span>© Throughline{% if info.entity %} · {{ info.entity }}{% endif %}</span>
    {% if info.contact_email %}<a href="mailto:{{ info.contact_email }}">{{ info.contact_email }}</a>{% endif %}
  </div>
</footer>
</body>
</html>
