<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Throughline Admin</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0b0e14; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .card {
    width: 320px; padding: 32px; border-radius: 12px; background: #141925;
    border: 1px solid #242b3d; box-shadow: 0 8px 30px rgba(0,0,0,0.4);
  }
  h1 { margin: 0 0 24px; font-size: 18px; color: #e6e9f0; font-weight: 600; }
  label { display: block; font-size: 12px; color: #8b93a7; margin-bottom: 6px; margin-top: 16px; }
  input {
    width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 8px;
    border: 1px solid #2a3244; background: #0f131c; color: #e6e9f0; font-size: 14px;
  }
  input:focus { outline: none; border-color: #4a7cff; }
  button {
    width: 100%; margin-top: 24px; padding: 10px; border-radius: 8px; border: none;
    background: #4a7cff; color: white; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button:hover { background: #3a6cf0; }
  .error { margin-top: 16px; color: #ff6b6b; font-size: 13px; }
</style>
</head>
<body>
  <div class="card">
    <h1>Throughline Admin</h1>
    <form method="POST" action="/admin/login">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" autofocus>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password">
      <button type="submit">Sign in</button>
    </form>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
  </div>
</body>
</html>
