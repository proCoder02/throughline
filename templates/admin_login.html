<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Throughline Ops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
  /* Same design tokens as frontend/src/theme.css (dark palette) -- kept in
     sync by value, not by sharing the file, since this is a plain
     server-rendered page with no build step. */
  :root {
    --wa-bg-app: #313338;
    --wa-panel: #2b2d31;
    --wa-hover: #35373c;
    --wa-border: #1f2023;
    --wa-text: #f2f3f5;
    --wa-text-soft: #a0a2a7;
    --wa-accent: #1FC8B4;
    --wa-accent-dark: #16A192;
    --wa-accent-solid: #128176;
    --wa-accent-solid-hover: #107066;
    --wa-danger: #da373c;
    --shadow-lg: 0 8px 24px rgba(0,0,0,0.38);
    --radius-sm: 6px;
    --radius-lg: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--wa-bg-app); color: var(--wa-text);
    font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .auth-card {
    background: var(--wa-panel); border-radius: var(--radius-lg); padding: 32px; width: 340px; max-width: calc(100vw - 32px);
    box-shadow: var(--shadow-lg);
  }
  .auth-card h1 { font-size: 24px; margin: 0 0 4px; color: var(--wa-accent-dark); font-weight: 800; }
  .auth-card p.hint { font-size: 13px; color: var(--wa-text-soft); margin: 0 0 24px; }
  label { display: block; font-size: 13px; color: var(--wa-text-soft); margin-bottom: 6px; margin-top: 16px; font-weight: 500; }
  .field {
    width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid var(--wa-border); border-radius: var(--radius-sm);
    background: var(--wa-bg-app); color: var(--wa-text); font-size: 14px; font-family: inherit;
    transition: border-color 180ms cubic-bezier(0.4,0,0.2,1), box-shadow 180ms cubic-bezier(0.4,0,0.2,1);
  }
  .field:focus { outline: none; border-color: var(--wa-accent); box-shadow: 0 0 0 3px rgba(31,200,180,0.2); }
  .btn {
    width: 100%; margin-top: 24px; padding: 10px; border: 0; border-radius: var(--radius-sm);
    background: var(--wa-accent-solid); color: #fff; font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer;
    transition: background-color 180ms cubic-bezier(0.4,0,0.2,1);
  }
  .btn:hover { background: var(--wa-accent-solid-hover); }
  .auth-error { color: var(--wa-danger); font-size: 13px; margin-top: 14px; }
</style>
</head>
<body>
  <div class="auth-card">
    <h1>Throughline Ops</h1>
    <p class="hint">Sign in to view job status, database and compute metrics.</p>
    <form method="POST" action="/admin/login">
      <label for="username">Username</label>
      <input class="field" type="text" id="username" name="username" autocomplete="username" autofocus>
      <label for="password">Password</label>
      <input class="field" type="password" id="password" name="password" autocomplete="current-password">
      <button class="btn" type="submit">Sign in</button>
    </form>
    {% if error %}<div class="auth-error">{{ error }}</div>{% endif %}
  </div>
</body>
</html>
