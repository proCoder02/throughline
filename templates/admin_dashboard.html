<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Throughline Ops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
  /* Same design tokens as frontend/src/theme.css (dark palette) -- kept in
     sync by value, not by sharing the file, since this is a plain
     server-rendered page with no build step. Only the subset this page
     actually uses is reproduced here. */
  :root {
    --wa-bg-app: #313338;
    --wa-panel: #2b2d31;
    --wa-hover: #35373c;
    --wa-border: #1f2023;
    --wa-text: #f2f3f5;
    --wa-text-soft: #a0a2a7;
    --wa-accent: #1FC8B4;
    --wa-accent-dark: #16A192;
    --wa-accent-solid: #128176;
    --wa-accent-solid-hover: #107066;
    --wa-danger: #da373c;
    --wa-online: #23a55a;
    --wa-warn-bg: #3d3720;
    --wa-warn-text: #f2d585;

    --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
    --space-5: 20px; --space-6: 24px;

    --radius-xs: 4px; --radius-sm: 6px; --radius-md: 8px; --radius-lg: 10px; --radius-pill: 999px; --radius-round: 50%;

    --text-xs: 12px; --text-sm: 13px; --text-base: 14px; --text-md: 15px; --text-lg: 16px; --text-xl: 18px; --text-2xl: 20px;

    --duration-fast: 120ms; --duration-base: 180ms; --duration-slow: 240ms;
    --ease-standard: cubic-bezier(0.4, 0, 0.2, 1); --ease-out: cubic-bezier(0, 0, 0.2, 1);

    --shadow-sm: 0 2px 8px rgba(0,0,0,0.28);
    --shadow-md: 0 4px 14px rgba(0,0,0,0.32);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--wa-bg-app); color: var(--wa-text);
    font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: var(--space-6) var(--space-4) 60px;
  }
  .wrap { max-width: 980px; margin: 0 auto; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-6); flex-wrap: wrap; gap: var(--space-3); }
  h1 { font-size: var(--text-2xl); margin: 0; font-weight: 700; }
  .meta { font-size: var(--text-xs); color: var(--wa-text-soft); }
  a.logout { color: var(--wa-text-soft); font-size: var(--text-sm); text-decoration: none; padding: var(--space-2) var(--space-3); border-radius: var(--radius-sm); transition: background-color var(--duration-base) var(--ease-standard), color var(--duration-base) var(--ease-standard); }
  a.logout:hover { background: var(--wa-hover); color: var(--wa-text); }

  .btn-secondary {
    background: var(--wa-hover); color: var(--wa-text); border: 0; font-family: inherit;
    font-size: var(--text-sm); font-weight: 500; padding: var(--space-2) var(--space-4); border-radius: var(--radius-sm); cursor: pointer;
    transition: background-color var(--duration-base) var(--ease-standard);
  }
  .btn-secondary:hover { background: #3f4147; }
  .btn-secondary:disabled { opacity: 0.6; cursor: default; }

  section { margin-bottom: var(--space-6); }
  h2 { font-size: var(--text-xs); text-transform: uppercase; letter-spacing: 0.04em; color: var(--wa-text-soft); margin: 0 0 var(--space-3); font-weight: 700; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: var(--space-3); }

  @keyframes cardIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .card {
    background: var(--wa-panel); border: 1px solid transparent; border-radius: var(--radius-md); padding: var(--space-4);
    animation: cardIn var(--duration-slow) var(--ease-out) both;
    transition: border-color var(--duration-base) var(--ease-standard), box-shadow var(--duration-base) var(--ease-standard);
  }
  .card:hover { border-color: var(--wa-border); box-shadow: var(--shadow-sm); }
  .card .title { font-size: var(--text-sm); color: var(--wa-text); font-weight: 600; margin-bottom: var(--space-2); display: flex; align-items: center; gap: var(--space-2); }

  .dot { width: 8px; height: 8px; border-radius: var(--radius-round); display: inline-block; flex-shrink: 0; }
  .dot.ok { background: var(--wa-online); }
  .dot.warn { background: var(--wa-warn-text); }
  .dot.bad { background: var(--wa-danger); }

  .row { display: flex; justify-content: space-between; align-items: center; font-size: var(--text-sm); color: var(--wa-text-soft); padding: 3px 0; gap: var(--space-2); }
  .row b { color: var(--wa-text); font-weight: 500; }

  .bar-track { height: 6px; background: var(--wa-bg-app); border-radius: var(--radius-xs); overflow: hidden; margin-top: var(--space-2); }
  .bar-fill { height: 100%; border-radius: var(--radius-xs); background: var(--wa-accent); transition: width var(--duration-slow) var(--ease-standard); }
  .bar-fill.warn { background: var(--wa-warn-text); }
  .bar-fill.bad { background: var(--wa-danger); }

  table { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
  table th { text-align: left; color: var(--wa-text-soft); font-weight: 500; padding: var(--space-2); border-bottom: 1px solid var(--wa-border); }
  table td { padding: var(--space-2); border-bottom: 1px solid var(--wa-border); color: var(--wa-text); }

  .pill { font-size: var(--text-xs); padding: 2px var(--space-2); border-radius: var(--radius-pill); font-weight: 600; }
  .pill.ok { background: rgba(35,165,90,0.18); color: #4fd189; }
  .pill.warn { background: rgba(242,213,133,0.18); color: var(--wa-warn-text); }
  .pill.bad { background: rgba(218,55,60,0.18); color: #f3787c; }

  .empty { color: var(--wa-text-soft); font-size: var(--text-sm); padding: var(--space-2) 0; }
  .err { color: var(--wa-danger); font-size: var(--text-sm); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Throughline Ops</h1>
    <div style="display:flex; align-items:center; gap:var(--space-3);">
      <span class="meta" id="generated-at">loading...</span>
      <button class="btn-secondary" id="refresh-btn" onclick="refresh()">Refresh</button>
      <a class="logout" href="/admin/logout">Log out</a>
    </div>
  </header>

  <section>
    <h2>Cron / Background Jobs</h2>
    <div class="grid" id="jobs-grid"><div class="empty">Loading...</div></div>
  </section>

  <section>
    <h2>EI Extraction (last 24h)</h2>
    <div id="ei-table"><div class="empty">Loading...</div></div>
  </section>

  <section>
    <h2>Weekly Digest</h2>
    <div class="grid" id="digest-grid"></div>
  </section>

  <section>
    <h2>FCM Push (last 24h)</h2>
    <div class="grid" id="fcm-grid"></div>
  </section>

  <section>
    <h2>Database</h2>
    <div class="grid" id="db-grid"></div>
  </section>

  <section>
    <h2>Compute</h2>
    <div class="grid" id="system-grid"></div>
  </section>
</div>

<script>
const REFRESH_MS = 30000;

function fmtAge(hours) {
  if (hours === null || hours === undefined) return "never";
  if (hours < 1) return Math.round(hours * 60) + "m ago";
  if (hours < 48) return hours.toFixed(1) + "h ago";
  return (hours / 24).toFixed(1) + "d ago";
}

function statusDot(job) {
  if (job.status === "never_run" || job.stale) return "bad";
  if (job.status === "success") return "ok";
  if (job.status === "partial") return "warn";
  return "bad";
}

function historyDot(status) {
  if (status === "success") return "ok";
  if (status === "partial") return "warn";
  return "bad";
}

function renderHistory(history) {
  if (!history || !history.length) return "";
  // Oldest first, left to right, so the most recent run is the rightmost
  // dot -- matches how a sparkline/heartbeat strip reads.
  const dots = history.slice().reverse().map(h => {
    const when = h.started_at ? new Date(h.started_at).toLocaleString() : "unknown";
    return `<span class="dot ${historyDot(h.status)}" title="${h.status} -- ${when}"></span>`;
  }).join("");
  return `<div class="row" style="gap:4px; margin-top:6px;"><span>History</span><span style="display:flex; gap:4px;">${dots}</span></div>`;
}

function renderJobs(jobs) {
  const el = document.getElementById("jobs-grid");
  if (!jobs || !jobs.length) { el.innerHTML = '<div class="empty">No jobs recorded yet.</div>'; return; }
  el.innerHTML = jobs.map(j => {
    const detail = j.detail ? JSON.stringify(j.detail).slice(0, 120) : "";
    return `
      <div class="card">
        <div class="title"><span class="dot ${statusDot(j)}"></span>${j.job_name}</div>
        <div class="row"><span>Status</span><b>${j.status}</b></div>
        <div class="row"><span>Last run</span><b>${fmtAge(j.age_hours)}</b></div>
        ${renderHistory(j.history)}
        ${detail ? `<div class="row" style="font-size:11px; color:var(--wa-text-soft);">${detail}</div>` : ""}
      </div>`;
  }).join("");
}

function renderEi(ei) {
  const el = document.getElementById("ei-table");
  const keys = Object.keys(ei || {});
  if (!keys.length) { el.innerHTML = '<div class="empty">No extraction activity in the last 24h.</div>'; return; }
  const rows = keys.map(k => {
    const v = ei[k];
    const pill = v.error > 0 ? "warn" : "ok";
    return `<tr><td>${k}</td><td>${v.success}</td><td><span class="pill ${pill}">${v.error}</span></td><td>${v.last_at ? new Date(v.last_at).toLocaleString() : "-"}</td></tr>`;
  }).join("");
  el.innerHTML = `<div class="card" style="padding:0;"><table><tr><th>run_type</th><th>success</th><th>error</th><th>last run</th></tr>${rows}</table></div>`;
}

function renderDigest(d) {
  const el = document.getElementById("digest-grid");
  el.innerHTML = `
    <div class="card">
      <div class="title">Sent (7d)</div>
      <div class="row"><b style="font-size:22px;">${d.sent_last_7d ?? 0}</b></div>
    </div>
    <div class="card">
      <div class="title">Last sent</div>
      <div class="row"><b>${d.last_sent_at ? new Date(d.last_sent_at).toLocaleString() : "never"}</b></div>
    </div>`;
}

function renderFcm(fcm) {
  const el = document.getElementById("fcm-grid");
  const by = fcm.last_24h || {};
  const sent = by.sent || 0, stale = by.stale || 0, error = by.error || 0, noToken = by.no_token || 0;
  const errPill = (error > 0 || stale > 0) ? "warn" : "ok";
  el.innerHTML = `
    <div class="card">
      <div class="title">Sent</div>
      <div class="row"><b style="font-size:22px;">${sent}</b></div>
    </div>
    <div class="card">
      <div class="title">Stale / Error</div>
      <div class="row"><span class="pill ${errPill}">${stale} stale, ${error} error</span></div>
    </div>
    <div class="card">
      <div class="title">No token</div>
      <div class="row"><b>${noToken}</b></div>
    </div>
    <div class="card">
      <div class="title">Registered devices</div>
      <div class="row"><b>${fcm.registered_tokens ?? 0}</b></div>
      <div class="row" style="font-size:11px;"><span>Last send</span><span>${fcm.last_send_at ? new Date(fcm.last_send_at).toLocaleString() : "never"}</span></div>
    </div>`;
}

function fmtBytes(b) {
  if (b === null || b === undefined) return "-";
  const gb = b / 1e9;
  if (gb >= 1) return gb.toFixed(2) + " GB";
  return (b / 1e6).toFixed(1) + " MB";
}

function renderDb(db) {
  const el = document.getElementById("db-grid");
  const tableRows = (db.largest_tables || []).map(t =>
    `<tr><td>${t.table}</td><td>${fmtBytes(t.bytes)}</td></tr>`
  ).join("");
  el.innerHTML = `
    <div class="card">
      <div class="title">Total DB size</div>
      <div class="row"><b style="font-size:22px;">${fmtBytes(db.total_bytes)}</b></div>
    </div>
    <div class="card" style="grid-column: span 2; padding:0;">
      <div class="title" style="padding:var(--space-4) var(--space-4) 0;">Largest tables</div>
      <table style="padding:0 var(--space-4) var(--space-3);"><tr><th>table</th><th>size</th></tr>${tableRows}</table>
    </div>`;
}

function barClass(pct) {
  if (pct >= 90) return "bad";
  if (pct >= 70) return "warn";
  return "";
}

function renderSystem(sys) {
  const el = document.getElementById("system-grid");
  const disk = sys.disk || {};
  const mem = sys.memory || {};
  const cpu = sys.cpu || {};

  const diskHtml = disk.error
    ? `<div class="err">${disk.error}</div>`
    : `<div class="row"><span>Used</span><b>${disk.used_gb} / ${disk.total_gb} GB</b></div>
       <div class="bar-track"><div class="bar-fill ${barClass(disk.percent_used)}" style="width:${disk.percent_used}%"></div></div>
       <div class="row" style="margin-top:6px;"><span>Free</span><b>${disk.free_gb} GB</b></div>`;

  const memHtml = mem.error
    ? `<div class="err">${mem.error}</div>`
    : `<div class="row"><span>Used</span><b>${(mem.used_mb/1024).toFixed(1)} / ${(mem.total_mb/1024).toFixed(1)} GB</b></div>
       <div class="bar-track"><div class="bar-fill ${barClass(mem.percent_used)}" style="width:${mem.percent_used}%"></div></div>`;

  const cpuHtml = cpu.error
    ? `<div class="err">${cpu.error}</div>`
    : `<div class="row"><span>Load (1m/5m/15m)</span><b>${cpu.load_1m} / ${cpu.load_5m} / ${cpu.load_15m}</b></div>
       <div class="row"><span>Cores</span><b>${cpu.core_count}</b></div>`;

  el.innerHTML = `
    <div class="card"><div class="title">Disk</div>${diskHtml}</div>
    <div class="card"><div class="title">Memory</div>${memHtml}</div>
    <div class="card"><div class="title">CPU</div>${cpuHtml}</div>`;
}

async function refresh() {
  const btn = document.getElementById("refresh-btn");
  btn.disabled = true;
  btn.textContent = "Refreshing...";
  try {
    const res = await fetch("/admin/api/status", { credentials: "same-origin" });
    if (res.status === 401 || res.redirected) { window.location.href = "/admin/login"; return; }
    const data = await res.json();
    renderJobs(data.jobs);
    renderEi(data.ei_realtime);
    renderDigest(data.weekly_digest);
    renderFcm(data.fcm);
    renderDb(data.db);
    renderSystem(data.system);
    document.getElementById("generated-at").textContent =
      "Updated " + new Date(data.generated_at).toLocaleTimeString() +
      " · EI " + (data.flags.emotional_intelligence_enabled ? "on" : "off") +
      " · Nudges " + (data.flags.nudge_feature_enabled ? "on" : "off");
  } catch (e) {
    document.getElementById("generated-at").textContent = "Failed to load: " + e;
  } finally {
    btn.disabled = false;
    btn.textContent = "Refresh";
  }
}

refresh();
setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
